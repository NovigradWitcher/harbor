name: Android CI

on:
  # push:
  #   branches:
  #     - main
  #   paths-ignore:
  #     - '**.md'
  #     - 'fastlane/**'
  #     - '.github/**'
  #     - '!.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Setup Java JDK
        uses: actions/setup-java@v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build with Gradle
        run: |
          touch signing.properties
          echo storeFile=../keystore.jks >> signing.properties
          echo storePassword=${{ secrets.KEYSTORE_PASSWORD }} >> signing.properties
          echo keyAlias=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
          echo keyPassword=${{ secrets.KEYSTORE_ALIAS_PASSWORD }} >> signing.properties
          echo ${{ secrets.KEYSTORE }} | base64 --decode > keystore.jks
          ./gradlew assembleRelease
          echo "filename=$(jq -r '.elements.[0].outputFile' app/build/outputs/apk/release/output-metadata.json)" >> $GITHUB_ENV
      - name: Extract version name
        run: |
          VERSION=$(grep -oP 'harbor\.versionName\s*=\s*\K\S+' gradle.properties)
          echo "version=$VERSION" >> $GITHUB_ENV
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.filename }}
          path: app/build/outputs/apk/release/${{ env.filename }}
          archive: false
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.version }}-${{ github.run_number}}
          name: Release ${{ env.version }} (${{ github.run_number}})
          files: app/build/outputs/apk/release/${{ env.filename }}
          make-latest: true
          token: ${{ secrets.GH_TOKEN }}
